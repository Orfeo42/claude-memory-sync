summary: memory-taskmine
description: 'Harness-improvement miner: scans the whole canonical corpus for repeated manual procedures
  worth turning into a reusable zsh function, script, or Claude Code skill. Always proposal-only (global/skills/**),
  never auto-applied. Prompt text lives in the Windmill variable f/memory/taskmine_draft (default body:
  deploy/windmill/prompts/taskmine-draft.md).

  '
schema:
  $schema: https://json-schema.org/draft/2020-12/schema
  type: object
  properties:
    synth_model:
      type: string
      default: sonnet
      description: claude -p --model value. Windmill variable f/memory/synth_model.
    taskmine_draft_prompt:
      type: string
      default: $var:f/memory/taskmine_draft
      description: deploy/windmill/prompts/taskmine-draft.md
  required: []
value:
  concurrent_limit: 1
  concurrency_time_window_s: 0
  modules:
  - id: ensure_work
    value:
      type: rawscript
      language: bash
      content: 'set -euo pipefail

        [ -z "${ANTHROPIC_API_KEY:-}" ] || { echo "ANTHROPIC_API_KEY set — refusing (API credits)" >&2;
        exit 1; }


        memoryctl ensure-work --repos-dir /data/repos --work-dir /data/work/canonical --lock /data/state/canonical.lock

        '
      input_transforms: {}
  - id: draft
    summary: mine the corpus for repeated manual procedures worth a skill
    value:
      type: rawscript
      language: bash
      content: "WM_TASKMINE_PROMPT=\"$1\"\nWM_MODEL=\"$2\"\nset -euo pipefail\n[ -z \"${ANTHROPIC_API_KEY:-}\"\
        \ ] || { echo \"ANTHROPIC_API_KEY set — refusing (API credits)\" >&2; exit 1; }\n\nprompt_file=$(mktemp)\n\
        trap 'rm -f \"$prompt_file\"' EXIT\nprintf '%s\\n\\n' \"$WM_TASKMINE_PROMPT\" > \"$prompt_file\"\
        \n\nprintf '=== existing skills — patterns already covered, do NOT re-propose ===\\n' >> \"$prompt_file\"\
        \nfor skill in /data/work/canonical/global/skills/*/SKILL.md; do\n  [ -f \"$skill\" ] || continue\n\
        \  name=$(basename \"$(dirname \"$skill\")\")\n  desc=$(awk '/^description:/{sub(/^description:[[:space:]]*/,\"\
        \"); print; exit}' \"$skill\")\n  printf -- '- %s: %s\\n' \"$name\" \"$desc\" >> \"$prompt_file\"\
        \ndone\nprintf '\\n' >> \"$prompt_file\"\n\nrejected=$(memoryctl proposal rejections \\\n  | python3\
        \ -c 'import json,sys; [print(p[\"name\"]) for p in json.load(sys.stdin)]' | sort -u)\nif [ -n\
        \ \"$rejected\" ]; then\n  printf '=== previously rejected proposals — do NOT re-propose ===\\\
        n' >> \"$prompt_file\"\n  printf '%s\\n\\n' \"$rejected\" >> \"$prompt_file\"\nfi\n\npending=$(for\
        \ status in pending approved; do\n    memoryctl proposal list --status \"$status\" \\\n      |\
        \ python3 -c 'import json,sys; [print(p[\"name\"]) for p in json.load(sys.stdin)]'\n  done | sort\
        \ -u)\nif [ -n \"$pending\" ]; then\n  printf '=== proposals currently pending human review —\
        \ do NOT re-propose ===\\n' >> \"$prompt_file\"\n  printf '%s\\n\\n' \"$pending\" >> \"$prompt_file\"\
        \nfi\n\nmemoryctl corpus list --work-dir /data/work/canonical \\\n  | python3 -c 'import json,sys;\
        \ [print(p[\"key\"]) for p in json.load(sys.stdin)]' \\\n  | while IFS= read -r key; do\n    \
        \  index=\"/data/work/canonical/projects/$key/memory/MEMORY.md\"\n      [ -f \"$index\" ] || continue\n\
        \      printf '=== project: %s ===\\n' \"$key\"\n      cat \"$index\"\n      printf '\\n'\n  \
        \  done >> \"$prompt_file\"\n\nclaude -p --model \"$WM_MODEL\" < \"$prompt_file\" \\\n  | memoryctl\
        \ ops-apply --source-flow taskmine --source-run \"${WM_ROOT_FLOW_JOB_ID:-${WM_FLOW_JOB_ID:-$WM_JOB_ID}}\"\
        \n"
      input_transforms:
        WM_TASKMINE_PROMPT:
          type: static
          value: $var:f/memory/taskmine_draft
        WM_MODEL:
          type: static
          value: $var:f/memory/synth_model
