# Windmill OpenFlow template — import via the Windmill UI/CLI and expect to
# adjust module/suspend syntax to match the running Windmill version. See
# deploy/windmill/setup.md ("Flow YAML caveat") before trusting this file
# verbatim.
#
# Schedule: weekly. Concurrency: 1 (serialize with itself).
summary: memory-taskmine
description: >
  Harness-improvement miner: scans the whole canonical corpus for repeated
  manual procedures worth turning into a reusable zsh function, script, or
  Claude Code skill. Always proposal-only (global/skills/**), never
  auto-applied. Prompt text lives in the Windmill variable
  f/memory/taskmine_draft (default body: deploy/windmill/prompts/taskmine-draft.md).

schema:
  $schema: "https://json-schema.org/draft/2020-12/schema"
  type: object
  properties:
    synth_model:
      type: string
      default: sonnet
      description: claude -p --model value. Windmill variable f/memory/synth_model.
    taskmine_draft_prompt:
      type: string
      default: "$var:f/memory/taskmine_draft"
      description: deploy/windmill/prompts/taskmine-draft.md
  required: []

value:
  # TODO verify: exact field names for the installed Windmill version.
  concurrent_limit: 1
  concurrency_time_window_s: 0

  modules:
    - id: ensure_work
      value:
        type: rawscript
        language: bash
        content: |
          set -euo pipefail
          [ -z "${ANTHROPIC_API_KEY:-}" ] || { echo "ANTHROPIC_API_KEY set — refusing (API credits)" >&2; exit 1; }

          memoryctl ensure-work --repos-dir /data/repos --work-dir /data/work/canonical
          rm -rf /tmp/proposals
          mkdir -p /tmp/proposals
        input_transforms: {}

    - id: draft
      summary: mine the corpus for repeated manual procedures worth a skill
      value:
        type: rawscript
        language: bash
        content: |
          WM_TASKMINE_PROMPT="$1"
          WM_MODEL="$2"
          set -euo pipefail
          [ -z "${ANTHROPIC_API_KEY:-}" ] || { echo "ANTHROPIC_API_KEY set — refusing (API credits)" >&2; exit 1; }

          prompt_file=$(mktemp)
          trap 'rm -f "$prompt_file"' EXIT
          printf '%s\n\n' "$WM_TASKMINE_PROMPT" > "$prompt_file"

          memoryctl corpus list --work-dir /data/work/canonical \
            | python3 -c 'import json,sys; [print(p["key"]) for p in json.load(sys.stdin)]' \
            | while IFS= read -r key; do
                index="/data/work/canonical/projects/$key/memory/MEMORY.md"
                [ -f "$index" ] || continue
                printf '=== project: %s ===\n' "$key"
                cat "$index"
                printf '\n'
              done >> "$prompt_file"

          claude -p --model "$WM_MODEL" < "$prompt_file" \
            | memoryctl ops-apply --proposals-dir /tmp/proposals
        input_transforms:
          WM_TASKMINE_PROMPT:
            type: javascript
            expr: flow_input.taskmine_draft_prompt
          WM_MODEL:
            type: javascript
            expr: flow_input.synth_model

    - id: check_proposals
      summary: any taskmine proposals staged in /tmp/proposals?
      value:
        type: rawscript
        language: bash
        content: |
          set -euo pipefail
          if find /tmp/proposals -type f 2>/dev/null | grep -q .; then
            echo true
          else
            echo false
          fi
        input_transforms: {}

    # TODO verify: branchone syntax (branches[].expr + branches[].modules,
    # default[]) for the installed Windmill version.
    - id: promote_if_approved
      value:
        type: branchone
        branches:
          - summary: proposals staged — ask for approval, then promote + push
            expr: "results.check_proposals === 'true'"
            modules:
              - id: taskmine_approval
                summary: >
                  Approval gate. Output groups staged proposals by skill
                  name. On Resume, fill the form field "approved" with
                  "all", "none", or a comma-separated list of the group
                  names to promote — only those are promoted, the rest are
                  deleted.
                value:
                  type: rawscript
                  language: bash
                  content: |
                    set -euo pipefail
                    md=$(mktemp)
                    printf '# Staged proposals\n\n' > "$md"
                    printf 'On **Resume**, set `approved` to `all`, `none`, or comma-separated group names.\n\n' >> "$md"
                    for f in /tmp/proposals/*; do
                      case "$f" in *.path) continue ;; esac
                      target=$(cat "$f.path")
                      case "$target" in
                        global/skills/*) group=$(printf '%s' "$target" | cut -d/ -f3) ;;
                        *) group=$(basename "$target") ;;
                      esac
                      printf '## %s\n\ntarget: `%s`\n\n````markdown\n' "$group" "$target" >> "$md"
                      cat "$f" >> "$md"
                      printf '\n````\n\n' >> "$md"
                    done
                    python3 -c 'import json,sys; print(json.dumps({"markdown": open(sys.argv[1]).read()}))' "$md" > ./result.json
                    rm -f "$md"
                  input_transforms: {}
                # TODO verify: suspend + resume_form field names for the
                # installed Windmill version.
                suspend:
                  required_events: 1
                  timeout: 604800
                  resume_form:
                    schema:
                      type: object
                      properties:
                        approved:
                          type: string
                          default: all
                          description: >
                            all | none | comma-separated group names to promote

              - id: taskmine_promote
                value:
                  type: rawscript
                  language: bash
                  content: |
                    WM_APPROVED="$1"
                    set -euo pipefail
                    [ -z "${ANTHROPIC_API_KEY:-}" ] || { echo "ANTHROPIC_API_KEY set — refusing (API credits)" >&2; exit 1; }

                    approved=$(printf '%s' "$WM_APPROVED" | tr -d ' ')
                    rm -f /tmp/promote-promoted /tmp/promote-discarded
                    for f in /tmp/proposals/*; do
                      case "$f" in *.path) continue ;; esac
                      target=$(cat "$f.path")
                      case "$target" in
                        global/skills/*) group=$(printf '%s' "$target" | cut -d/ -f3) ;;
                        *) group=$(basename "$target") ;;
                      esac
                      if [ "$approved" = "all" ] || printf ',%s,' "$approved" | grep -q ",$group,"; then
                        memoryctl proposal-apply --work-dir /data/work/canonical --file "$f"
                        memoryctl commit --work-dir /data/work/canonical \
                          --lock /data/state/canonical.lock \
                          --message "taskmine: $group" \
                          --pathspec global
                        printf '%s\n' "$target" >> /tmp/promote-promoted
                      else
                        printf '%s\n' "$target" >> /tmp/promote-discarded
                      fi
                      rm -f "$f" "$f.path"
                    done

                    memoryctl push --work-dir /data/work/canonical --lock /data/state/canonical.lock

                    python3 - <<'EOF' > ./result.json
                    import json, pathlib
                    def lines(p):
                        f = pathlib.Path(p)
                        return f.read_text().splitlines() if f.exists() else []
                    print(json.dumps({"promoted": lines("/tmp/promote-promoted"), "discarded": lines("/tmp/promote-discarded")}))
                    EOF
                    rm -f /tmp/promote-promoted /tmp/promote-discarded
                  input_transforms:
                    WM_APPROVED:
                      type: javascript
                      expr: resume?.approved ?? 'all'
        default: []
