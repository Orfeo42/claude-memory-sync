summary: memory-daily-synth
description: 'Per-project condense/dedup (+ optional staleness deletion), cross-project distillation with
  proposals posted to pipeline-api for human approval, and hot-cache digest regeneration. Prompt text lives in Windmill variables
  — see deploy/windmill/setup.md for the full variable list.

  '
schema:
  $schema: https://json-schema.org/draft/2020-12/schema
  type: object
  properties:
    synth_model:
      type: string
      default: sonnet
      description: claude -p --model value. Windmill variable f/memory/synth_model.
    staleness_enabled:
      type: boolean
      default: false
      description: 'When true, append the staleness-deletion addendum to the condense prompt. Windmill
        variable f/memory/staleness_enabled.

        '
    hotcache_max_bytes:
      type: integer
      default: 4000
      description: Windmill variable f/memory/hotcache_max_bytes.
    condense_prompt:
      type: string
      default: $var:f/memory/synth_condense
      description: deploy/windmill/prompts/synth-condense.md
    staleness_prompt:
      type: string
      default: $var:f/memory/synth_staleness
      description: deploy/windmill/prompts/synth-staleness.md
    distill_scan_prompt:
      type: string
      default: $var:f/memory/distill_scan
      description: deploy/windmill/prompts/distill-scan.md
    distill_write_prompt:
      type: string
      default: $var:f/memory/distill_write
      description: deploy/windmill/prompts/distill-write.md
    hotcache_digest_prompt:
      type: string
      default: $var:f/memory/hotcache_digest
      description: deploy/windmill/prompts/hotcache-digest.md
  required: []
value:
  concurrent_limit: 1
  concurrency_time_window_s: 0
  modules:
  - id: ensure_work
    value:
      type: rawscript
      language: bash
      content: 'set -euo pipefail

        [ -z "${ANTHROPIC_API_KEY:-}" ] || { echo "ANTHROPIC_API_KEY set — refusing (API credits)" >&2;
        exit 1; }


        memoryctl ensure-work --repos-dir /data/repos --work-dir /data/work/canonical --lock /data/state/canonical.lock

        '
      input_transforms: {}
  - id: corpus_list
    summary: 'output shape: [{"key":str,"entries":int,"lastCommit":str}]'
    value:
      type: rawscript
      language: bash
      content: 'set -euo pipefail

        [ -z "${ANTHROPIC_API_KEY:-}" ] || { echo "ANTHROPIC_API_KEY set — refusing (API credits)" >&2;
        exit 1; }


        memoryctl corpus list --work-dir /data/work/canonical

        '
      input_transforms: {}
  - id: condense_keys
    summary: project keys with >= 2 entries (mirrors synth.sh's entry_count guard)
    value:
      type: rawscript
      language: bash
      content: 'WM_CORPUS="$1"

        set -euo pipefail

        printf ''%s'' "$WM_CORPUS" | python3 -c ''

        import json, sys

        data = json.load(sys.stdin)

        keys = [p["key"] for p in data if p.get("entries", 0) >= 2]

        print(json.dumps(sorted(keys)))

        ''

        '
      input_transforms:
        WM_CORPUS:
          type: javascript
          expr: results.corpus_list
  - id: all_keys
    summary: every project key, used for the hot-cache pass below
    value:
      type: rawscript
      language: bash
      content: 'WM_CORPUS="$1"

        set -euo pipefail

        printf ''%s'' "$WM_CORPUS" | python3 -c ''

        import json, sys

        data = json.load(sys.stdin)

        keys = [p["key"] for p in data]

        print(json.dumps(sorted(keys)))

        ''

        '
      input_transforms:
        WM_CORPUS:
          type: javascript
          expr: results.corpus_list
  - id: condense
    summary: condense (+ optional staleness) each eligible project
    value:
      type: forloopflow
      iterator:
        type: javascript
        expr: JSON.parse(results.condense_keys)
      skip_failures: true
      modules:
      - id: condense_one
        value:
          type: rawscript
          language: bash
          content: "WM_PROJECT_KEY=\"$1\"\nWM_CONDENSE_PROMPT=\"$2\"\nWM_STALENESS_PROMPT=\"$3\"\nWM_STALENESS_ENABLED=\"\
            $4\"\nWM_MODEL=\"$5\"\nset -euo pipefail\n[ -z \"${ANTHROPIC_API_KEY:-}\" ] || { echo \"ANTHROPIC_API_KEY\
            \ set — refusing (API credits)\" >&2; exit 1; }\n\nkey=\"$WM_PROJECT_KEY\"\nmemory_dir=\"\
            /data/work/canonical/projects/$key/memory\"\n\nprompt_file=$(mktemp)\nctx_file=$(mktemp)\n\
            trap 'rm -f \"$prompt_file\" \"$ctx_file\"' EXIT\n\nprintf '%s\\n\\n' \"$WM_CONDENSE_PROMPT\"\
            \ > \"$prompt_file\"\nif [ \"$WM_STALENESS_ENABLED\" = \"true\" ]; then\n  printf '%s\\n\\\
            n' \"$WM_STALENESS_PROMPT\" >> \"$prompt_file\"\nfi\n\nprintf '{\"clients\":[]}' \\\n  | memoryctl\
            \ context --repos-dir /data/repos --work-dir /data/work/canonical --project \"$key\" \\\n\
            \  > \"$ctx_file\"\ncat \"$ctx_file\" >> \"$prompt_file\"\n\nclaude -p --model \"$WM_MODEL\"\
            \ < \"$prompt_file\" \\\n  | memoryctl ops-apply --allow-delete --memory-dir \"$memory_dir\"\
            \n\nmemoryctl commit --work-dir /data/work/canonical \\\n  --lock /data/state/canonical.lock\
            \ \\\n  --message \"synthesize: $key\" \\\n  --pathspec \"projects/$key/memory\"\n"
          input_transforms:
            WM_PROJECT_KEY:
              type: javascript
              expr: flow_input.iter.value
            WM_CONDENSE_PROMPT:
              type: static
              value: $var:f/memory/synth_condense
            WM_STALENESS_PROMPT:
              type: static
              value: $var:f/memory/synth_staleness
            WM_STALENESS_ENABLED:
              type: static
              value: $var:f/memory/staleness_enabled
            WM_MODEL:
              type: static
              value: $var:f/memory/synth_model
  - id: distill_scan
    summary: stage 1 — find cross-project clusters
    value:
      type: rawscript
      language: bash
      content: "WM_DISTILL_SCAN_PROMPT=\"$1\"\nWM_MODEL=\"$2\"\nset -euo pipefail\n[ -z \"${ANTHROPIC_API_KEY:-}\"\
        \ ] || { echo \"ANTHROPIC_API_KEY set — refusing (API credits)\" >&2; exit 1; }\n\nprompt_file=$(mktemp)\n\
        trap 'rm -f \"$prompt_file\"' EXIT\nprintf '%s\\n\\n' \"$WM_DISTILL_SCAN_PROMPT\" > \"$prompt_file\"\
        \n\nmemoryctl corpus list --work-dir /data/work/canonical \\\n  | python3 -c 'import json,sys;\
        \ [print(p[\"key\"]) for p in json.load(sys.stdin)]' \\\n  | while IFS= read -r key; do\n    \
        \  index=\"/data/work/canonical/projects/$key/memory/MEMORY.md\"\n      [ -f \"$index\" ] || continue\n\
        \      printf '=== project: %s ===\\n' \"$key\"\n      cat \"$index\"\n      printf '\\n'\n  \
        \  done >> \"$prompt_file\"\n\nclaude -p --model \"$WM_MODEL\" < \"$prompt_file\"\n"
      input_transforms:
        WM_DISTILL_SCAN_PROMPT:
          type: static
          value: $var:f/memory/distill_scan
        WM_MODEL:
          type: static
          value: $var:f/memory/synth_model
  - id: distill_clusters
    summary: NOTHING or JSON Lines -> JSON array of cluster objects
    value:
      type: rawscript
      language: bash
      content: "WM_SCAN_OUT=\"$1\"\nset -euo pipefail\nprintf '%s' \"$WM_SCAN_OUT\" | python3 -c '\nimport\
        \ json, sys\nraw = sys.stdin.read().strip()\nclusters = []\nif raw and raw != \"NOTHING\":\n \
        \   for line in raw.splitlines():\n        line = line.strip()\n        if not line:\n       \
        \     continue\n        try:\n            clusters.append(json.loads(line))\n        except json.JSONDecodeError:\n\
        \            print(\"distill_clusters: skipping unparseable line: \" + line, file=sys.stderr)\n\
        print(json.dumps(clusters))\n'\n"
      input_transforms:
        WM_SCAN_OUT:
          type: javascript
          expr: results.distill_scan
  - id: distill_write
    summary: stage 2 — write a unified entry / deletes / proposals per cluster
    value:
      type: forloopflow
      iterator:
        type: javascript
        expr: JSON.parse(results.distill_clusters)
      skip_failures: true
      modules:
      - id: distill_one
        value:
          type: rawscript
          language: bash
          content: "WM_CLUSTER_JSON=\"$1\"\nWM_DISTILL_WRITE_PROMPT=\"$2\"\nWM_MODEL=\"$3\"\nset -euo\
            \ pipefail\n[ -z \"${ANTHROPIC_API_KEY:-}\" ] || { echo \"ANTHROPIC_API_KEY set — refusing\
            \ (API credits)\" >&2; exit 1; }\n\ncluster_json=\"$WM_CLUSTER_JSON\"\ntitle=$(printf '%s'\
            \ \"$cluster_json\" | python3 -c 'import json,sys; print(json.load(sys.stdin)[\"title\"])')\n\
            \n# v1 simplification: the LLM is asked to pick \"the single most\n# relevant project\" for\
            \ the ===FILE: op, but memoryctl\n# ops-apply targets one --memory-dir per invocation, so\
            \ the\n# shell resolves the target as the FIRST project listed in\n# the cluster's entries[]\
            \ rather than parsing it back out of\n# the model's free-form output. See setup.md.\ntarget_project=$(printf\
            \ '%s' \"$cluster_json\" | python3 -c '\nimport json, sys\nc = json.load(sys.stdin)\nprint(c[\"\
            entries\"][0].split(\"/\", 1)[0])\n')\nmemory_dir=\"/data/work/canonical/projects/$target_project/memory\"\
            \n\nprompt_file=$(mktemp)\ntrap 'rm -f \"$prompt_file\"' EXIT\nprintf '%s\\n\\n' \"$WM_DISTILL_WRITE_PROMPT\"\
            \ > \"$prompt_file\"\nprintf 'CLUSTER:\\n%s\\n\\nENTRIES:\\n' \"$cluster_json\" >> \"$prompt_file\"\
            \n\nprintf '%s' \"$cluster_json\" | python3 -c '\nimport json, sys\nc = json.load(sys.stdin)\n\
            for e in c[\"entries\"]:\n    print(e)\n' | while IFS='/' read -r proj file; do\n    [ -z\
            \ \"$proj\" ] && continue\n    printf -- '--- %s/%s ---\\n' \"$proj\" \"$file\"\n    memoryctl\
            \ corpus read --work-dir /data/work/canonical --project \"$proj\" --file \"$file\"\n    printf\
            \ '\\n'\n  done >> \"$prompt_file\"\n\nclaude -p --model \"$WM_MODEL\" < \"$prompt_file\"\
            \ \\\n  | memoryctl ops-apply --allow-delete --memory-dir \"$memory_dir\" --source-flow daily-synth\
            \ --source-run \"${WM_ROOT_FLOW_JOB_ID:-${WM_FLOW_JOB_ID:-$WM_JOB_ID}}\"\n\nmemoryctl commit\
            \ --work-dir /data/work/canonical \\\n  --lock /data/state/canonical.lock \\\n  --message\
            \ \"distill: $title\" \\\n  --pathspec \"projects/$target_project/memory\"\n"
          input_transforms:
            WM_CLUSTER_JSON:
              type: javascript
              expr: JSON.stringify(flow_input.iter.value)
            WM_DISTILL_WRITE_PROMPT:
              type: static
              value: $var:f/memory/distill_write
            WM_MODEL:
              type: static
              value: $var:f/memory/synth_model
  - id: hotcache
    summary: regenerate the hot-cache digest for every project
    value:
      type: forloopflow
      iterator:
        type: javascript
        expr: JSON.parse(results.all_keys)
      skip_failures: true
      modules:
      - id: hotcache_one
        value:
          type: rawscript
          language: bash
          content: "WM_PROJECT_KEY=\"$1\"\nWM_HOTCACHE_PROMPT=\"$2\"\nWM_MODEL=\"$3\"\nWM_MAX_BYTES=\"\
            $4\"\nset -euo pipefail\n[ -z \"${ANTHROPIC_API_KEY:-}\" ] || { echo \"ANTHROPIC_API_KEY set\
            \ — refusing (API credits)\" >&2; exit 1; }\n\nkey=\"$WM_PROJECT_KEY\"\nmemory_dir=\"/data/work/canonical/projects/$key/memory\"\
            \n\nprompt_file=$(mktemp)\nctx_file=$(mktemp)\ntrap 'rm -f \"$prompt_file\" \"$ctx_file\"\
            ' EXIT\n\nprintf '{\"clients\":[]}' \\\n  | memoryctl context --repos-dir /data/repos --work-dir\
            \ /data/work/canonical --project \"$key\" \\\n  > \"$ctx_file\"\n\nprintf '%s\\n\\n' \"$WM_HOTCACHE_PROMPT\"\
            \ > \"$prompt_file\"\ncat \"$ctx_file\" >> \"$prompt_file\"\n\nclaude -p --model \"$WM_MODEL\"\
            \ < \"$prompt_file\" \\\n  | memoryctl hotcache-write --memory-dir \"$memory_dir\" --max-bytes\
            \ \"$WM_MAX_BYTES\"\n\n# output location of hotcache-write is not pinned down by\n# the CLI\
            \ contract (memory_dir vs project root) — commit the\n# whole project directory to be safe.\n\
            memoryctl commit --work-dir /data/work/canonical \\\n  --lock /data/state/canonical.lock \\\
            \n  --message \"hotcache: $key\" \\\n  --pathspec \"projects/$key\"\n"
          input_transforms:
            WM_PROJECT_KEY:
              type: javascript
              expr: flow_input.iter.value
            WM_HOTCACHE_PROMPT:
              type: static
              value: $var:f/memory/hotcache_digest
            WM_MODEL:
              type: static
              value: $var:f/memory/synth_model
            WM_MAX_BYTES:
              type: static
              value: $var:f/memory/hotcache_max_bytes
  - id: push
    value:
      type: rawscript
      language: bash
      content: 'set -euo pipefail

        [ -z "${ANTHROPIC_API_KEY:-}" ] || { echo "ANTHROPIC_API_KEY set — refusing (API credits)" >&2;
        exit 1; }


        memoryctl push --work-dir /data/work/canonical --lock /data/state/canonical.lock

        '
      input_transforms: {}
