services:
  memory-server:
    image: ghcr.io/orfeo42/claude-memory-sync-server:latest
    pull_policy: "always"
    init: true
    volumes:
      - memory-data:/data
    environment:
      MEMORY_TOKEN: ${MEMORY_TOKEN:?}
    ports:
      - "8080:8080"
    restart: unless-stopped

  memory-backup:
    image: alpine/git
    profiles:
      - backup
    volumes:
      - memory-data:/data
      - ${MEMORY_BACKUP_SSH_KEY:-/dev/null}:/root/.ssh/id_ed25519:ro
    entrypoint: ["git", "-C", "/data", "push", "origin", "storage"]

  pipeline-db:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: pipeline
      POSTGRES_DB: pipeline
      POSTGRES_PASSWORD: ${PIPELINE_DB_PASSWORD:?}
    volumes:
      - pipeline-db-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pipeline -d pipeline"]
    networks:
      - pipeline-db-net
    restart: unless-stopped

  pipeline-api:
    image: ghcr.io/orfeo42/claude-memory-sync-pipeline:latest
    pull_policy: "always"
    environment:
      PIPELINE_DATABASE_URL: postgres://pipeline:${PIPELINE_DB_PASSWORD:?}@pipeline-db:5432/pipeline?sslmode=disable
      PIPELINE_TOKEN: ${PIPELINE_TOKEN:?}
      PIPELINE_ADMIN_TOKEN: ${PIPELINE_ADMIN_TOKEN:?}
    networks:
      - pipeline-db-net
      - pipeline
    depends_on:
      pipeline-db:
        condition: service_healthy
    restart: unless-stopped

  synth:
    image: ghcr.io/orfeo42/claude-memory-sync-synth:latest
    pull_policy: "always"
    init: true
    volumes:
      - memory-data:/data
    environment:
      PIPELINE_URL: http://pipeline-api:8090
      PIPELINE_TOKEN: ${PIPELINE_ADMIN_TOKEN:?}
      CLAUDE_CODE_OAUTH_TOKEN: ${CLAUDE_CODE_OAUTH_TOKEN:-}
      TZ: ${TZ:-Europe/Rome}
    ports:
      - "${SYNTH_BIND:-127.0.0.1}:8082:8082"
    networks:
      - default
      - pipeline
    depends_on:
      pipeline-api:
        condition: service_started
    restart: unless-stopped

networks:
  pipeline-db-net:
    internal: true
  pipeline:
    internal: true

volumes:
  memory-data:
  pipeline-db-data:
