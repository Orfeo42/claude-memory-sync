services:
  memory-server:
    image: ghcr.io/orfeo42/claude-memory-sync-server:latest
    pull_policy: "always"
    volumes:
      - memory-data:/data
    environment:
      MEMORY_TOKEN: ${MEMORY_TOKEN:?}
    ports:
      - "8080:8080"
    restart: unless-stopped

  memory-synthesizer:
    image: ghcr.io/orfeo42/claude-memory-sync-synthesizer:latest
    volumes:
      - memory-data:/data
    environment:
      CLAUDE_CODE_OAUTH_TOKEN: ${CLAUDE_CODE_OAUTH_TOKEN:-}
      SYNTH_INTERVAL: ${SYNTH_INTERVAL:-24h}
      SYNTH_MODEL: ${SYNTH_MODEL:-sonnet}
    restart: unless-stopped

  memory-intake:
    image: ghcr.io/orfeo42/claude-memory-sync-synthesizer:latest
    entrypoint: ["/usr/local/bin/intake-run.sh"]
    volumes:
      - memory-data:/data
    environment:
      CLAUDE_CODE_OAUTH_TOKEN: ${CLAUDE_CODE_OAUTH_TOKEN:-}
      INTAKE_INTERVAL: ${INTAKE_INTERVAL:-45m}
      SYNTH_MODEL: ${SYNTH_MODEL:-sonnet}
    restart: unless-stopped

  memory-backup:
    image: alpine/git
    profiles:
      - backup
    volumes:
      - memory-data:/data
      - ${MEMORY_BACKUP_SSH_KEY:-/dev/null}:/root/.ssh/id_ed25519:ro
    entrypoint: ["git", "-C", "/data", "push", "origin", "storage"]

  windmill-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: windmill
      POSTGRES_DB: windmill
      POSTGRES_PASSWORD: ${WINDMILL_DB_PASSWORD:?}
    volumes:
      - windmill-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U windmill"]
    restart: unless-stopped

  windmill-server:
    image: ghcr.io/windmill-labs/windmill:main
    environment:
      DATABASE_URL: postgres://windmill:${WINDMILL_DB_PASSWORD:?}@windmill-db/windmill?sslmode=disable
      MODE: server
    ports:
      - "8081:8000"
    depends_on:
      windmill-db:
        condition: service_healthy
    restart: unless-stopped

  windmill-worker:
    image: ghcr.io/orfeo42/claude-memory-sync-windmill-worker:latest
    pull_policy: "always"
    environment:
      DATABASE_URL: postgres://windmill:${WINDMILL_DB_PASSWORD:?}@windmill-db/windmill?sslmode=disable
      MODE: worker
      WORKER_GROUP: default
      CLAUDE_CODE_OAUTH_TOKEN: ${CLAUDE_CODE_OAUTH_TOKEN:?}
    volumes:
      - memory-data:/data
    depends_on:
      windmill-db:
        condition: service_healthy
      windmill-server:
        condition: service_started
    restart: unless-stopped

volumes:
  memory-data:
  windmill-db-data:
