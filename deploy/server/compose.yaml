services:
  memory-server:
    image: ghcr.io/orfeo42/claude-memory-sync-server:latest
    pull_policy: "always"
    init: true
    volumes:
      - memory-data:/data
    environment:
      MEMORY_TOKEN: ${MEMORY_TOKEN:?}
    ports:
      - "8080:8080"
    restart: unless-stopped

  memory-backup:
    image: alpine/git
    profiles:
      - backup
    volumes:
      - memory-data:/data
      - ${MEMORY_BACKUP_SSH_KEY:-/dev/null}:/root/.ssh/id_ed25519:ro
    entrypoint: ["git", "-C", "/data", "push", "origin", "storage"]

  windmill-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: windmill
      POSTGRES_DB: windmill
      POSTGRES_PASSWORD: ${WINDMILL_DB_PASSWORD:?}
    volumes:
      - windmill-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U windmill"]
    restart: unless-stopped

  windmill-server:
    image: ghcr.io/windmill-labs/windmill:main
    pull_policy: "always"
    environment:
      DATABASE_URL: postgres://windmill:${WINDMILL_DB_PASSWORD:?}@windmill-db/windmill?sslmode=disable
      MODE: server
    ports:
      - "8081:8000"
    depends_on:
      windmill-db:
        condition: service_healthy
    restart: unless-stopped

  pipeline-db:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: pipeline
      POSTGRES_DB: pipeline
      POSTGRES_PASSWORD: ${PIPELINE_DB_PASSWORD:?}
    volumes:
      - pipeline-db-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pipeline -d pipeline"]
    networks:
      - pipeline-db-net
    restart: unless-stopped

  pipeline-api:
    image: ghcr.io/orfeo42/claude-memory-sync-pipeline:latest
    pull_policy: "always"
    environment:
      PIPELINE_DATABASE_URL: postgres://pipeline:${PIPELINE_DB_PASSWORD:?}@pipeline-db:5432/pipeline?sslmode=disable
      PIPELINE_TOKEN: ${PIPELINE_TOKEN:?}
      PIPELINE_ADMIN_TOKEN: ${PIPELINE_ADMIN_TOKEN:?}
    networks:
      - pipeline-db-net
      - pipeline
    depends_on:
      pipeline-db:
        condition: service_healthy
    restart: unless-stopped

  windmill-worker-llm-steps:
    image: ghcr.io/orfeo42/claude-memory-sync-windmill-worker:latest
    pull_policy: "always"
    init: true
    environment:
      DATABASE_URL: postgres://windmill:${WINDMILL_DB_PASSWORD:?}@windmill-db/windmill?sslmode=disable
      MODE: worker
      WORKER_GROUP: default
      CLAUDE_CODE_OAUTH_TOKEN: ${CLAUDE_CODE_OAUTH_TOKEN:?}
      PIPELINE_URL: http://pipeline-api:8090
      PIPELINE_TOKEN: ${PIPELINE_TOKEN:?}
      WHITELIST_ENVS: CLAUDE_CODE_OAUTH_TOKEN,PIPELINE_URL,PIPELINE_TOKEN
    networks:
      - default
      - pipeline
    volumes:
      - memory-data:/data
    depends_on:
      windmill-db:
        condition: service_healthy
      windmill-server:
        condition: service_started
      pipeline-api:
        condition: service_started
    restart: unless-stopped

  windmill-worker-ui-backend:
    image: ghcr.io/orfeo42/claude-memory-sync-windmill-worker:latest
    pull_policy: "always"
    init: true
    environment:
      DATABASE_URL: postgres://windmill:${WINDMILL_DB_PASSWORD:?}@windmill-db/windmill?sslmode=disable
      MODE: worker
      WORKER_GROUP: ui-backend
      WORKER_TAGS: python3,dependency
      CLAUDE_CODE_OAUTH_TOKEN: ${CLAUDE_CODE_OAUTH_TOKEN:?}
      PIPELINE_URL: http://pipeline-api:8090
      PIPELINE_TOKEN: ${PIPELINE_ADMIN_TOKEN:?}
      WHITELIST_ENVS: CLAUDE_CODE_OAUTH_TOKEN,PIPELINE_URL,PIPELINE_TOKEN
    networks:
      - default
      - pipeline
    volumes:
      - memory-data:/data
    depends_on:
      windmill-db:
        condition: service_healthy
      windmill-server:
        condition: service_started
      pipeline-api:
        condition: service_started
    restart: unless-stopped

networks:
  pipeline-db-net:
    internal: true
  pipeline:
    internal: true

volumes:
  memory-data:
  windmill-db-data:
  pipeline-db-data:
