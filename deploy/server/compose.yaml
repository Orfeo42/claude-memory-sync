services:
  memory-server:
    image: ghcr.io/orfeo42/claude-memory-sync-server:latest
    pull_policy: "always"
    volumes:
      - memory-data:/data
    environment:
      MEMORY_TOKEN: ${MEMORY_TOKEN:?}
    ports:
      - "8080:8080"
    restart: unless-stopped

  memory-synthesizer:
    image: ghcr.io/orfeo42/claude-memory-sync-synthesizer:latest
    volumes:
      - memory-data:/data
    environment:
      CLAUDE_CODE_OAUTH_TOKEN: ${CLAUDE_CODE_OAUTH_TOKEN:-}
      SYNTH_INTERVAL: ${SYNTH_INTERVAL:-24h}
      SYNTH_MODEL: ${SYNTH_MODEL:-sonnet}
    restart: unless-stopped

  memory-intake:
    image: ghcr.io/orfeo42/claude-memory-sync-synthesizer:latest
    entrypoint: ["/usr/local/bin/intake-run.sh"]
    volumes:
      - memory-data:/data
    environment:
      CLAUDE_CODE_OAUTH_TOKEN: ${CLAUDE_CODE_OAUTH_TOKEN:-}
      INTAKE_INTERVAL: ${INTAKE_INTERVAL:-45m}
      SYNTH_MODEL: ${SYNTH_MODEL:-sonnet}
    restart: unless-stopped

  memory-backup:
    image: alpine/git
    profiles:
      - backup
    volumes:
      - memory-data:/data
      - ${MEMORY_BACKUP_SSH_KEY:-/dev/null}:/root/.ssh/id_ed25519:ro
    entrypoint: ["git", "-C", "/data", "push", "origin", "storage"]

  memory-git:
    image: codeberg.org/forgejo/forgejo:15-rootless
    environment:
      FORGEJO__security__INSTALL_LOCK: "true"
      FORGEJO__database__DB_TYPE: sqlite3
      FORGEJO__server__ROOT_URL: http://raspberry:8081/
      FORGEJO__server__HTTP_PORT: "3000"
      FORGEJO__server__DISABLE_SSH: "true"
      FORGEJO__service__DISABLE_REGISTRATION: "true"
      FORGEJO__service__REQUIRE_SIGNIN_VIEW: "false"
      FORGEJO__repository__ENABLE_PUSH_CREATE_USER: "true"
      FORGEJO__repository__DEFAULT_PUSH_CREATE_PRIVATE: "false"
      FORGEJO__repository__DEFAULT_PRIVATE: public
    volumes:
      - forgejo-data:/var/lib/gitea
      - forgejo-config:/etc/gitea
    ports:
      - "8081:3000"
    restart: unless-stopped

  memory-git-mirror:
    image: alpine/git
    depends_on:
      - memory-git
    entrypoint:
      [
        "sh",
        "-c",
        "git config --global safe.directory '*'; while true; do for r in /data/repos/canonical.git /data/repos/clients/*.git; do [ -d \"$$r\" ] || continue; n=$$(basename \"$$r\" .git); case \"$$r\" in */clients/*) n=\"client-$$n\";; esac; git --git-dir=\"$$r\" push --mirror \"http://$$FORGEJO_MIRROR_USER:$$FORGEJO_MIRROR_PASSWORD@memory-git:3000/$$FORGEJO_MIRROR_USER/$$n.git\" >/dev/null 2>&1 || echo \"mirror push failed: $$n\"; done; sleep $${MIRROR_INTERVAL:-60}; done",
      ]
    environment:
      FORGEJO_MIRROR_USER: ${FORGEJO_MIRROR_USER:?}
      FORGEJO_MIRROR_PASSWORD: ${FORGEJO_MIRROR_PASSWORD:?}
      MIRROR_INTERVAL: ${MIRROR_INTERVAL:-60}
    volumes:
      - memory-data:/data:ro
    restart: unless-stopped

volumes:
  memory-data:
  forgejo-data:
  forgejo-config:
