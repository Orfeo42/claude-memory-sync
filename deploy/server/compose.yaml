services:
  memory-server:
    image: ghcr.io/orfeo42/claude-memory-sync-server:latest
    pull_policy: "always"
    volumes:
      - memory-data:/data
    environment:
      MEMORY_TOKEN: ${MEMORY_TOKEN:?}
    ports:
      - "8080:8080"
    restart: unless-stopped

  memory-synthesizer:
    image: ghcr.io/orfeo42/claude-memory-sync-synthesizer:latest
    volumes:
      - memory-data:/data
    environment:
      CLAUDE_CODE_OAUTH_TOKEN: ${CLAUDE_CODE_OAUTH_TOKEN:-}
      SYNTH_INTERVAL: ${SYNTH_INTERVAL:-24h}
      SYNTH_MODEL: ${SYNTH_MODEL:-sonnet}
    restart: unless-stopped

  memory-intake:
    image: ghcr.io/orfeo42/claude-memory-sync-synthesizer:latest
    entrypoint: ["/usr/local/bin/intake-run.sh"]
    volumes:
      - memory-data:/data
    environment:
      CLAUDE_CODE_OAUTH_TOKEN: ${CLAUDE_CODE_OAUTH_TOKEN:-}
      INTAKE_INTERVAL: ${INTAKE_INTERVAL:-45m}
      SYNTH_MODEL: ${SYNTH_MODEL:-sonnet}
    restart: unless-stopped

  memory-backup:
    image: alpine/git
    profiles:
      - backup
    volumes:
      - memory-data:/data
      - ${MEMORY_BACKUP_SSH_KEY:-/dev/null}:/root/.ssh/id_ed25519:ro
    entrypoint: ["git", "-C", "/data", "push", "origin", "storage"]

  memory-browser:
    image: jonashaag/klaus:latest
    entrypoint:
      [
        "sh",
        "-c",
        "exec klaus --host 0.0.0.0 --port 80 --site-name memory /data/repos/canonical.git /data/repos/clients/*.git",
      ]
    volumes:
      - memory-data:/data:ro
    ports:
      - "8081:80"
    restart: unless-stopped

  memory-vault-sync:
    image: alpine/git
    entrypoint:
      [
        "sh",
        "-c",
        "git config --global safe.directory '*'; while true; do if [ -d /vault/.git ]; then git -C /vault fetch origin && git -C /vault reset --hard origin/main; else find /vault -mindepth 1 -maxdepth 1 -exec rm -rf {} +; git clone /data/repos/canonical.git /vault; fi; sleep $${VAULT_SYNC_INTERVAL:-300}; done",
      ]
    environment:
      VAULT_SYNC_INTERVAL: ${VAULT_SYNC_INTERVAL:-300}
    volumes:
      - memory-data:/data:ro
      - memory-vault:/vault
    restart: unless-stopped

  memory-wiki:
    image: sec77/perlite:latest
    platform: linux/arm/v7
    environment:
      NOTES_PATH: Memory
      SITE_TITLE: memory
      SHOW_LOCAL_GRAPH: "true"
      SHOW_TOC: "true"
    volumes:
      - perlite-app:/var/www/perlite
      - memory-vault:/var/www/perlite/Memory:ro
    restart: unless-stopped

  memory-wiki-web:
    image: nginx:stable
    depends_on:
      - memory-wiki
    volumes:
      - ./perlite.conf:/etc/nginx/conf.d/default.conf:ro
      - perlite-app:/var/www/perlite:ro
      - memory-vault:/var/www/perlite/Memory:ro
    ports:
      - "8082:80"
    restart: unless-stopped

volumes:
  memory-data:
  memory-vault:
  perlite-app:
